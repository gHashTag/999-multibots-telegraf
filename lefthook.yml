# Гейты репозитория. Заменяет husky.
#
# ПОЧЕМУ ЗАМЕНА, А НЕ НАСТРОЙКА СТАРОГО. Прежний pre-commit звал lint-staged и
# сразу печатал «✅ Все проверки пройдены», НЕ проверяя код возврата. А сам линт
# не мог отработать в принципе: конфига ESLint в репозитории не было вообще, и
# стандартный парсер падал на первой строке каждого файла
# («The keyword 'import' is reserved»). Гейт годами сообщал об успехе, ничего не
# проверив, — худший вид гейта: он создаёт ощущение защиты и снимает
# внимательность.
#
# ДВА ПРИНЦИПА, из которых собрана эта конфигурация.
#
# 1. ПРОВЕРЯЕМ ТО, ЧТО МЕНЯЕТ КОММИТ, А НЕ ВЕСЬ РЕПОЗИТОРИЙ. В коде накоплен
#    долг: 30 ошибок линта, 208 падающих тестов из 2699. Гейт по всему
#    репозиторию перекрыл бы любую работу и был бы немедленно отключён — то
#    есть снова превратился бы в фикцию. Линт и тесты берут только затронутые
#    файлы: чинишь то, к чему прикоснулся.
#
# 2. ГЕЙТ, КОТОРЫЙ НЕ МОЖЕТ ОТРАБОТАТЬ, ПАДАЕТ ГРОМКО. Ни одна команда здесь
#    не заканчивается `|| true`. Если проверка сломалась — коммит стоит, а не
#    едет дальше с зелёной галочкой.
#
# Аварийный выход, когда правка срочная: LEFTHOOK=0 git commit ...
# Он намеренно требует осознанного действия и виден в истории команд.

min_version: 1.5.0

# Прогон занимает секунды: без этого четыре проверки идут последовательно.
colors: true

pre-commit:
  parallel: true
  commands:
    # 1. Утечка секретов. Единственная проверка, которая работала и раньше, —
    #    и единственная, где цена пропуска необратима: токен в истории git
    #    остаётся навсегда.
    secrets:
      priority: 1
      run: ./scripts/security-token-guard.sh staged
      fail_text: "Секрет в изменениях. Коммит остановлен."

    # 2. Форматирование. Правит файлы и добавляет их обратно в индекс, поэтому
    #    stage_fixed — иначе в коммит уйдёт неотформатированная версия.
    format:
      glob: "*.{ts,tsx,js,cjs,mjs,json,md,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    # 3. Линт ТОЛЬКО по изменённым файлам.
    #    Предупреждения не блокируют: их 2908, это долг, а не дефекты правки.
    #    Ошибки блокируют: их 30, и все — настоящие классы (недостижимый код,
    #    объявление в case без блока, самоприсваивание).
    lint:
      glob: "*.{ts,tsx}"
      exclude: '^(apps|docs|dist|build)/'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
      fail_text: "Линт нашёл ошибку в изменённых файлах."

    # 4. Быстрая проверка типов — только когда затронут TypeScript.
    #    --pretty false обязателен: цветной вывод содержит ANSI-последовательности,
    #    и grep по «error TS» на нём молча не совпадает (проверено — показывал 0
    #    при 1230 реальных ошибках).
    typecheck:
      glob: "*.{ts,tsx}"
      exclude: '^apps/'
      run: npx tsc --noEmit --pretty false
      fail_text: "Ошибки типов. Правка не поедет в историю."

    # 5. Плеер живёт под apps/ и в проверку выше не попадает: у него свой
    #    tsconfig и свои node_modules. Здесь ХРАПОВИК: ноль сегодня
    #    недостижим, поэтому условие не «должно быть 0», а «не больше, чем
    #    вчера». Порог опускается вместе с работой и никогда не растёт.
    #
    #    Почему это вообще нужно: «46 ошибок, как на main» несколько циклов
    #    подряд закрывало проверку и ничего не значило. Внутри лежали два
    #    ReferenceError и три молча теряемых значения.
    player-types:
      glob: "apps/vibee-editor/player/**/*.{ts,tsx}"
      run: node scripts/check-player-types.cjs
      fail_text: "Ошибок типов в плеере стало больше. Это находки, а не фон."

    # 6. No Cyrillic in code comments. The bot is bilingual, so Cyrillic inside
    #    string literals (UI text) stays allowed — the guard strips string
    #    literals first and only rejects Cyrillic left in comments/identifiers.
    #    Ratchet on the staged diff: existing Russian comments and .md docs are
    #    untouched. Escape hatch: put  cyrillic-ok  on the line.
    #    Swift is in the glob because it was the hole: on 07.09.2026 a Swift
    #    test file shipped with Cyrillic test names and this gate said nothing,
    #    because .swift was in neither the glob nor the script. Both lists must
    #    agree -- the glob decides which files reach the script at all.
    # The reel factory's topic queue: a bad entry does not crash, it publishes.
    # Only when a queue is actually staged, so an ordinary commit pays nothing.
    topics:
      glob: "*topics*.json"
      run: node loop/validate-topics.mjs {staged_files}
    no-cyrillic:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,swift}"
      run: node scripts/no-cyrillic-guard.cjs staged
      fail_text: "Cyrillic in a code comment. Write comments in English."

commit-msg:
  commands:
    # Сообщение коммита уходит в публичный репозиторий вместе с кодом:
    # секрет в нём так же необратим, как в файле.
    no-secrets-in-message:
      # The URL branch came from the old husky prepare-commit-msg hook, which
      # this file replaced. It catches what the shape patterns cannot: a link
      # carrying a credential in its query string, whose value looks like
      # nothing in particular. Ported deliberately rather than dropped -- a
      # pasted dashboard URL with ?token= is exactly how a secret reaches a
      # public repository without looking like a secret.
      run: |
        if grep -qEi '(bot[0-9]{8,}:[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.)' {1}; then
          echo "В сообщении коммита похоже на токен. Уберите его."
          exit 1
        fi
        if grep -qEi 'https?://[^[:space:]]*[?&][^[:space:]]*(token|secret|key|auth)=' {1}; then
          echo "В сообщении коммита ссылка с токеном в параметрах. Уберите её."
          exit 1
        fi

    # Commit messages go to the public repo and are read by everyone: keep them
    # English. Translations (UI string literals) stay Russian — see the
    # pre-commit no-cyrillic guard; this only covers the message text.
    no-cyrillic-in-message:
      run: node scripts/no-cyrillic-guard.cjs msg {1}

pre-push:
  parallel: true
  commands:
    # Защищённая ветка + перезапись истории. Проверка перенесена из старого
    # husky-хука: force push — запрет №0 в правилах репозитория, и терять его
    # при переезде было нельзя.
    git-guard:
      priority: 1
      # use_stdin — git отдаёт pre-push хуку строки «local_ref local_sha
      # remote_ref remote_sha». Без этого скрипт уходит на менее точный
      # запасной путь через remote-tracking ветку.
      use_stdin: true
      run: ./scripts/git-guard-push.sh

    secrets:
      run: ./scripts/security-token-guard.sh range

    # Тесты ТОЛЬКО связанные с изменёнными файлами, И ТОЛЬКО новые падения.
    #
    # Одного `vitest related` оказалось мало. Измерено прогоном на main:
    # 183 файла тестов, 69 из них падают, 207 упавших тестов из 2699. related
    # тянет тесты по графу импортов, поэтому достаточно тронуть файл, который
    # транзитивно импортирует один из этих 69, — и push встаёт из-за поломки,
    # к которой правка отношения не имеет. Такие ворота отключают в первый же
    # день.
    # test-guard.cjs сравнивает со снимком scripts/tests-baseline.json и
    # падает только на файлах, которых там нет. Размер долга печатается
    # каждый прогон, чтобы он не исчез из виду.
    # NO glob AND NO {push_files}, and skip_empty off on purpose.
    #
    # lefthook skips a command whose computed file list is empty, and that list
    # is empty for a branch with no counterpart on the remote -- the FIRST push
    # of a feature branch, the one carrying every commit on it. Verified with a
    # dry-run to a fresh ref: "related-tests (skip) no files for inspection",
    # a summary that looked healthy having inspected nothing.
    #
    # The script works out its own range instead; see scripts/test-guard.cjs.
    related-tests:
      skip_empty: false
      run: node scripts/test-guard.cjs
      fail_text: "Упали тесты, которых не было в базе."

    # Событие без подписчика — деньги уходят провайдерам, а результат никуда.
    # Скрипт уже есть в репозитории и печатает недостижимые функции первыми.
    orphan-events:
      run: node scripts/orphan-events.cjs

    # Мёртвый домен three-head-dragon.shop возвращался в код трижды. Скрипт
    # падает при его появлении; намеренные упоминания помечаются комментарием.
    dead-domain:
      run: node scripts/check-dead-domain.cjs

    # Дымовой тест ВСЕХ функций через mock. Самодостаточно: поднимает mock,
    # гоняет 84 проверки (32 инструмента MCP + A2A + генерация + рендер + лента +
    # ВСЕ провайдеры: Kling/HeyGen/FAL/Replicate/OpenAI/video/broll/voices/
    # Hedra/BFL), гасит сервер. Ничего не тратит, ~5с. Падает громко, если
    # сломан контракт любой функции. Лучшая практика: контракт всех функций
    # проверяется перед каждым push, а не только «эта правка компилируется».
    mock-functions:
      run: bash apps/vibee-editor/render/mock-selfcheck.sh
      fail_text: "Mock-проверки функций упали — сломан контракт функции или провайдера."

    # Трекнутый симлинк ломает pull/checkout ВСЕМ (git отказывается перезаписать
    # untracked node_modules -> Aborting). PR #1608 закоммитил node_modules как
    # симлинк на абсолютный путь чужой машины; .gitignore `node_modules/` (со
    # слешем) его не поймал. CI мёртв, ловить больше нечему. Гейт падает на ЛЮБОМ
    # трекнутом симлинке (mode 120000) — чистая база 0. Фикс: git rm + .gitignore
    # имя без слеша. Абсолютные пути этот гейт НЕ трогает (их 50, только триаж:
    # node .claude/loop-opus/repo-hygiene-audit.mjs).
    repo-hygiene:
      run: node .claude/loop-opus/repo-hygiene-audit.mjs --gate
      fail_text: "Трекнутый симлинк в репозитории (класс #1608) — ломает pull/checkout всем."

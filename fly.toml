# Fly.io configuration for 999-multibots-telegraf
# Production deployment

app = "999-multibots-telegraf"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  API_PORT = "3001"
  TELEGRAM_WEBHOOK_MODE = "false"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  protocol = "tcp"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[experimental]
  cmd = ["node", "dist/index.js"]

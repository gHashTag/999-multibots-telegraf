app = "999-multibots-rust"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.rust"

[env]
  RUST_LOG = "info"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  protocol = "tcp"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

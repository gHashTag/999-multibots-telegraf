[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Deploy ONLY when something the runtime image actually contains has changed.
# Every push to main redeploys this service; on 2026-09-08 that was 15 deploys
# in 3 hours (autonomous loops merging), 6 of them touching only tests, loop
# tooling or docs. Each redeploy restarts every bot: in-memory Telegraf
# sessions are wiped mid-wizard and polling has a hand-over window, so users
# saw a bot that "does not work". The Dockerfile bundles src/index.ts with
# esbuild after COPY . ., so these are the inputs that can change the image.
# Negated patterns exclude test files, which esbuild never bundles.
watchPatterns = [
  "src/**",
  "!src/__tests__/**",
  "!src/**/*.test.ts",
  "package.json",
  "package-lock.json",
  "Dockerfile",
  "railway.toml",
  "tsconfig.json",
  "tsconfig.*.json",
  "scripts/install-hooks.cjs",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
numReplicas = 1
# Seconds between SIGTERM and SIGKILL for the previous deploy. Railway's
# default is 0: the old container was killed at once, cutting off any agent
# turn in flight. src/index.ts drains the agent lanes for SHUTDOWN_DRAIN_MS
# (25 s) after SIGTERM and then tells sellers who was left unanswered; this
# gives it the time. Key and default verified 2026-09-21 against
# https://railway.com/railway.schema.json (deploy.drainingSeconds, number)
# and docs.railway.com/reference/deployments ("By default, it is given 0
# seconds to gracefully shutdown before being forcefully stopped").
drainingSeconds = 30

[service]
name = "999-multibots-telegraf"

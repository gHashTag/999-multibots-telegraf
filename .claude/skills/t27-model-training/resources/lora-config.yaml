# LoRA под t27: конфигурация и обоснование каждого числа.
#
# Формат — axolotl. Значения подобраны под ИЗМЕРЕННЫЙ корпус (08.09.2026):
# 207 обучающих примеров и 34 оценочных, задача — НАПИСАНИЕ спека .t27.
#
# Числа перевыведены после разворота: раньше здесь стояли 26/7 для задачи
# «спек -> Verilog», от которой отказались (годных пар для неё ноль). Конфигурация,
# чьи комментарии описывают другие данные, — способ потратить аренду GPU впустую.
#
# ЗАПУСКАТЬ НЕ НА RAILWAY: там нет GPU ни на одном тарифе. Арендованная
# карта на часы; 4B в 4-битном режиме умещается в 24 ГБ VRAM.

base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
# ЗАМЕНЕНО 08.09.2026 с Qwen3-1.7B, и вот почему.
#
# База кодовая, а не общая: t27 — Rust/Zig-подобный язык, и модель, видевшая
# много кода, тратит адаптацию на словарь проекта, а не на грамматику.
# Вся область генерации HDL (RTLCoder, VeriReason) строится на этой же базе.
#
# Окно ровно 32768 — см. замер у sequence_len ниже.
#
# Лицензия apache-2.0, проверено через HF API.
#
# ЧЕГО БРАТЬ НЕЛЬЗЯ, ХОТЯ ХОЧЕТСЯ:
#   Qwen/Qwen2.5-Coder-3B-Instruct  — лицензия "other". Внутри ОДНОГО семейства
#       1.5B и 7B под apache-2.0, а 3B нет. Кто возьмёт «средний размер», не
#       глядя, возьмёт единственный непермиссивный.
#   Nellyw888/VeriReason-*          — лицензия НЕ УКАЗАНА вовсе.
#   davide221/verilog-instruct-60k  — лицензия НЕ УКАЗАНА вовсе.
#   bnadimi/PyraNet-Verilog         — CC-BY-NC-SA, коммерческое использование
#       запрещено, а платформа коммерческая.
#
# Больше по размеру: Qwen/Qwen2.5-Coder-7B-Instruct (apache-2.0).

load_in_4bit: true
# QLoRA. На 1.7B не обязательно, но делает рецепт одинаковым при переходе на 4B.

datasets:
  - path: spec-dataset/train.jsonl
    type: chat_template
    field_messages: messages
test_datasets:
  - path: spec-dataset/eval.jsonl
    type: chat_template
    field_messages: messages
    split: train

sequence_len: 32768
# ПЕРЕМЕРЕНО 08.09.2026 ПОД НЫНЕШНИЕ ДАННЫЕ (набор написания спеков, не пары
# спек->Verilog, для которых это число выводилось раньше):
#
#   обучение (207): медиана 2690 токенов, p95 20365, максимум 33009
#                   при 32768 не влезает ОДИН пример
#   оценка   (34):  максимум 55172 — ТРИ примера длиннее окна
#
# ⚠️ У базы Qwen2.5-Coder-1.5B окно ровно 32768. Значит три оценочных вопроса
# из 34 модель физически не может ответить, и ПОТОЛОК ОЦЕНКИ 91%, а не 100%.
# Это не дефект модели; считать её ошибкой на этих трёх нельзя.
#
# Обрезка запрещена: она учит модель обрывать генерацию примерно на этом месте,
# потому что во всех длинных примерах ответ заканчивается ничем.
sample_packing: false
# Упаковка склеивает независимые примеры в одну последовательность. При 207
# примерах с медианой 2690 токенов она сэкономила бы много памяти — и именно
# поэтому отключена сознательно: склейка перемешивает НЕСВЯЗАННЫЕ спеки в одном
# окне, а модель учится тому, что в окне рядом. Экономия здесь не стоит риска
# научить её, что за концом одного модуля начинается чужой.

adapter: lora
lora_r: 16
# Низкий ранг намеренно. Ёмкость адаптера должна соответствовать данным.
# Примеров стало 207 вместо 26 — это уже «сотни», при которых поднимать ранг
# осмысленно; но поднимать его ДО первого прогона значит менять два условия
# сразу и не узнать, какое сработало.
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true
# Все линейные слои, а не только внимание: адаптация к языку и идиомам живёт в
# MLP не меньше, чем во внимании, и на таком объёме лишние параметры дешевле
# недообучения.

num_epochs: 3
# Три, не десять. На 207 примерах переобучение наступает медленнее, чем на 26,
# но это всё ещё малый набор; а признак его —
# рост eval loss при падении train loss; смотреть надо именно на расхождение.
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.1
micro_batch_size: 1
gradient_accumulation_steps: 8
# Последовательности до 32K: батч больше единицы не поместится, накопление
# градиента даёт эффективный размер 8.

bf16: auto
gradient_checkpointing: true
flash_attention: true

val_set_size: 0
# Оценочный набор задан ЯВНО в test_datasets и разбит стратифицированно
# ПО ОБЛАСТЯМ (`build-spec-dataset.mjs`, 32 области). Случайное разбиение может
# оставить целую область невиданной в оценке, а области — это как раз то, где
# словарь различается сильнее всего.
evals_per_epoch: 2
save_strategy: epoch

output_dir: ./out-t27-lora

# ── ЧЕГО ЭТА КОНФИГУРАЦИЯ НЕ ЧИНИТ ────────────────────────────────────────
#
# ТРИ ОЦЕНОЧНЫХ ВОПРОСА ДЛИННЕЕ ОКНА. Максимум 55172 токена при окне 32768,
# то есть потолок оценки 91%. Либо считать эти три вне зачёта, либо брать базу
# с большим окном (Qwen3.5-4B — 262144), но это меняет и базу, и результат.
#
# ОЦЕНКА НЕ СУДИТ ПРАВИЛЬНОСТЬ ПО СУЩЕСТВУ. `score-spec-answers.mjs` меряет
# валидность, релевантность (тот ли модуль) и долю совпавших имён. Спек может
# быть валидным, релевантным и при этом делать не то. Проверить это может только
# человек или прогон тестов из самого спека.
#
# 207 ПРИМЕРОВ — ВСЁ ЕЩЁ МАЛО. Больше даёт только расширение корпуса: ~360
# IMPLEMENTED лежат в trinity/apps/website, но это копии и другой диалект.

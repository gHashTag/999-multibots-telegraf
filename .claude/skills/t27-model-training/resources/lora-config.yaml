# LoRA под t27: конфигурация и обоснование каждого числа.
#
# Формат — axolotl. Значения подобраны под ИЗМЕРЕННЫЙ корпус (08.09.2026):
# 26 обучающих примеров и 7 оценочных при контексте 32K. Это очень маленький
# набор, и почти все отличия от обычного рецепта LoRA следуют из этого.
#
# ЗАПУСКАТЬ НЕ НА RAILWAY: там нет GPU ни на одном тарифе. Арендованная
# карта на часы; 4B в 4-битном режиме умещается в 24 ГБ VRAM.

base_model: Qwen/Qwen3-1.7B
# Почему 1.7B первой, а не 4B: при 26 примерах разница в качестве базы почти
# наверняка утонет в шуме оценки на 7 примерах. Дешёвый прогон отвечает на
# вопрос «конвейер вообще работает», и только потом имеет смысл платить за 4B.
# Проверенные замены (все Apache-2.0): Qwen/Qwen3.5-4B,
# Qwen/Qwen3-4B-Thinking-2507, HuggingFaceTB/SmolLM3-3B.

load_in_4bit: true
# QLoRA. На 1.7B не обязательно, но делает рецепт одинаковым при переходе на 4B.

datasets:
  - path: lora-dataset/train.jsonl
    type: chat_template
    field_messages: messages
test_datasets:
  - path: lora-dataset/eval.jsonl
    type: chat_template
    field_messages: messages
    split: train

sequence_len: 32768
# ИЗМЕРЕНО, а не выбрано: при 8192 не влезают 13 пар из 35, при 32768 — две.
# Обрезка тут запрещена: она учит модель обрывать генерацию примерно на этом
# месте, потому что во всех длинных примерах ответ заканчивается ничем.
sample_packing: false
# Упаковка склеивает независимые примеры в одну последовательность. При 26
# примерах это перемешало бы спеки друг с другом ради экономии, которая здесь
# ничего не решает.

adapter: lora
lora_r: 16
# Низкий ранг намеренно. Ёмкость адаптера должна соответствовать данным: на
# 26 примерах r=64 запомнит их дословно и не обобщит. Поднимать имеет смысл
# только после того, как примеров станут сотни.
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true
# Все линейные слои, а не только внимание: адаптация к языку и идиомам живёт в
# MLP не меньше, чем во внимании, и на таком объёме лишние параметры дешевле
# недообучения.

num_epochs: 3
# Три, не десять. На 26 примерах переобучение наступает быстро, а признак его —
# рост eval loss при падении train loss; смотреть надо именно на расхождение.
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.1
micro_batch_size: 1
gradient_accumulation_steps: 8
# Последовательности до 32K: батч больше единицы не поместится, накопление
# градиента даёт эффективный размер 8.

bf16: auto
gradient_checkpointing: true
flash_attention: true

val_set_size: 0
# Оценочный набор задан ЯВНО в test_datasets и разбит стратифицированно
# (`prepare-lora-dataset.mjs`). Случайное разбиение здесь может оставить ноль
# Rust в оценке — 31 пара из 35 это Verilog, — и тогда потеря умения писать
# Rust просто не будет замечена.
evals_per_epoch: 2
save_strategy: epoch

output_dir: ./out-t27-lora

# ── ЧЕГО ЭТА КОНФИГУРАЦИЯ НЕ ЧИНИТ ────────────────────────────────────────
#
# 26 примеров — мало, и никакой набор гиперпараметров этого не исправит.
# Разрезать длинные пары на мелкие ПРОВЕРЕНО и не работает: крупные
# сгенерированные Verilog-файлы содержат ровно один модуль (60 КБ — один
# модуль), делится только Rust.
#
# Единственный настоящий рычаг — больше пар: спеков 493, а вывод кодогенератора
# закоммичен лишь у 35. Прогон генератора по остальным даёт кратный рост числа
# примеров, и только после него имеет смысл спорить о ранге и эпохах.

<!doctype html>
<html lang="en">
  <head>
    <!-- deploy-probe: overflow-fix-715 -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Браузеры всё равно запрашивают /favicon.ico, если он не объявлен явно —
         в логах это давало ровный поток 404. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- interactiveWidget=resizes-content: на Android клавиатура сжимает контент,
         а не накрывает его — иначе поле ввода уезжает под клавиатуру.
         maximum-scale — страховка от зума при фокусе (основное лечение —
         font-size: 16px на сенсорных, см. design-system.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Telegram Mini Apps runtime. Must be a classic (non-async, non-defer)
         script in <head>: `<script type="module">` is deferred by spec, so a
         classic head script is guaranteed to have parsed the #tgWebApp* launch
         fragment into window.Telegram.WebApp before React boots. Must be loaded
         from telegram.org — Telegram version-gates behaviour on this origin. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Primary Meta Tags -->
    <title>VIBEE - AI Video Editor | Powered by V5 Ultra-Minimal Language</title>
    <meta name="title" content="VIBEE - AI Video Editor | Powered by V5 Ultra-Minimal Language" />
    <meta name="description" content="Create stunning videos with AI-powered editing. Built on VIBEE V5 - 75% less boilerplate, 100x faster compilation, ML/RL integration. Generate avatars, add captions, and produce professional content in minutes." />
    <meta name="keywords" content="AI video editor, video creation, talking avatar, AI captions, video generator, content creation, VIBEE V5, parallel computing, ML/RL, Gleam, BEAM, functional programming" />
    <meta name="author" content="VIBEE" />
    <meta name="robots" content="index, follow" />
    <!-- No canonical, og:url or twitter:url in the shell: this one index.html is
         served for every route (/feed, /blog, /<username>, legal pages), so a
         fixed URL here would declare each of them a copy of the home page. -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VIBEE - AI Video Editor | Powered by V5 Ultra-Minimal Language" />
    <meta property="og:description" content="Create stunning videos with AI-powered editing. Built on VIBEE V5 with 75% less boilerplate, 100x faster compilation, and ML/RL integration." />
    <meta property="og:image" content="https://app.t27.ai/icons/icon-512x512.png" />
    <meta property="og:site_name" content="VIBEE" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter -->
    <!-- "summary", not "summary_large_image": the only preview image is the square 512px icon. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VIBEE - AI Video Editor" />
    <meta name="twitter:description" content="Create stunning videos with AI-powered editing. Generate avatars, add captions, and produce professional content in minutes." />
    <meta name="twitter:image" content="https://app.t27.ai/icons/icon-512x512.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#f59e0b" />
    <meta name="msapplication-TileColor" content="#f59e0b" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VIBEE" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" />
    <link rel="dns-prefetch" href="https://vibee-render-production.up.railway.app" />

    <!-- Prefetch default video and audio for faster editor startup -->
    <link rel="prefetch" href="/lipsync/lipsync.mp4" />
    <link rel="prefetch" href="/audio/music/bgmusic.mp3" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VIBEE",
      "description": "AI-powered video editor for creating professional videos with talking avatars and automatic captions",
      "url": "https://app.t27.ai/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "VIBEE",
        "url": "https://app.t27.ai/"
      },
      "featureList": [
        "AI Avatar Generation",
        "Automatic Captions",
        "Video Templates",
        "B-Roll Integration",
        "Multi-language Support"
      ]
    }
    </script>
  </head>
  <body>
    <!--
      ЗАПАСНОЙ ЭКРАН ВНУТРИ #root.

      Замер 2026-08-26: маршрут /editor на телефоне оставлял #root ПУСТЫМ —
      чёрный экран без единого слова. Причина снаружи React: маршрут просит
      дюжину с лишним микрочанков одним залпом (есть по 154 байта), и
      сорвавшаяся загрузка убивает монтирование целиком. ErrorBoundary тут
      бессилен: он живёт внутри дерева, которое не успело появиться.

      React заменяет содержимое #root при монтировании, поэтому в обычной
      жизни этой разметки никто не увидит. Она показывается ровно в том
      случае, когда показывать больше нечего.

      Обработчик ошибок загрузки модулей ниже: он ловит сорвавшийся чанк и
      предлагает перезагрузку. Один раз — автоматически (сеть моргнула,
      второй заход обычно проходит), дальше уже словами, иначе получилась бы
      петля перезагрузок на действительно сломанной сборке.
    -->
    <div id="root">
      <div id="boot-fallback" style="
        min-height:100dvh;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;
        padding:32px;text-align:center;
        font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
        color:#8a8578;background:#0a0a0a;">
        <div style="width:34px;height:34px;border:2px solid #2a2820;
          border-top-color:#e6e0d2;border-radius:50%;
          animation:boot-spin .9s linear infinite"></div>
        <p style="margin:0;font-size:14px;color:#e6e0d2">Загружаю приложение…</p>
        <p id="boot-hint" style="margin:0;font-size:12px;max-width:280px;line-height:1.5">
          Если экран не сменится — значит не догрузились файлы. Обнови страницу.
        </p>
      </div>
      <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      // Один автоматический повтор при сорвавшейся загрузке модуля: чаще
      // всего это моргнувшая сеть, и второй заход проходит. Повторяем ровно
      // один раз — метка в sessionStorage, иначе сломанная сборка дала бы
      // бесконечную петлю перезагрузок.
      (function () {
        var KEY = 'vibee-boot-retry';
        function onFail() {
          if (sessionStorage.getItem(KEY)) {
            var h = document.getElementById('boot-hint');
            if (h) {
              h.textContent =
                'Файлы приложения не загрузились. Проверь связь и обнови страницу.';
              h.style.color = '#d98c8c';
            }
            return;
          }
          sessionStorage.setItem(KEY, '1');
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) onFail();
        }, true);
        window.addEventListener('vite:preloadError', onFail);
        // Успешное монтирование снимает метку: следующая настоящая поломка
        // снова получит право на один автоматический повтор.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var r = document.getElementById('root');
            if (r && !document.getElementById('boot-fallback')) {
              sessionStorage.removeItem(KEY);
            }
          }, 3000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

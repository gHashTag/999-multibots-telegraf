<!doctype html>
<!--
  TRI identity bridge: https://app.t27.ai/bridge, framed by the game on
  https://t27.ai when the game runs top-level. No React, no Telegram script,
  no third-party code. nginx serves it with its own strict policy (see the
  bridge locations in nginx/default.conf.template). The page is empty until
  the game asks and this tab has a session without consent yet: then the
  prompt below is the whole page (who asks and for what, Continue, Not now).
  The copy is English here and switched to ?lang=ru by bridge.js.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TRI</title>
    <link rel="stylesheet" href="/bridge/bridge.css" />
  </head>
  <body>
    <div id="tri-ask" hidden>
      <p id="tri-purpose">t27.ai wants your TRI name and picture</p>
      <div class="actions">
        <button id="tri-continue" type="button" hidden>
          Continue with TRI
        </button>
        <button id="tri-dismiss" type="button">Not now</button>
      </div>
      <p id="tri-blocked" role="alert" hidden></p>
    </div>
    <script src="/bridge/bridge.js"></script>
  </body>
</html>

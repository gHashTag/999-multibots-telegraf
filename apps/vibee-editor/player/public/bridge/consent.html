<!doctype html>
<!--
  TRI consent popup: https://app.t27.ai/bridge/consent.html, opened by the
  identity bridge (bridge.js) when the game on https://t27.ai first asks who
  the visitor is in this tab. A top-level window, so no page that frames the
  bridge can hide or cover it; nginx serves it with frame-ancestors 'none'.
  It reads no storage and no session. The copy is English here and switched
  to ?lang=ru by consent.js. Behaviour: consent.js.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRI: continue on t27.ai?</title>
    <link rel="stylesheet" href="/bridge/consent.css" />
  </head>
  <body>
    <p>
      <strong>https://t27.ai</strong>
      <span id="tri-consent-asks"
        >asks who you are on TRI: your Telegram id, name and picture.</span
      >
    </p>
    <button id="tri-consent" type="button" hidden>Continue with TRI</button>
    <button id="tri-decline" type="button" class="secondary" hidden>
      Not now
    </button>
    <p class="note" id="tri-consent-note">
      This lasts for this tab only. Sign out in TRI to withdraw it.
    </p>
    <script src="/bridge/consent.js"></script>
  </body>
</html>

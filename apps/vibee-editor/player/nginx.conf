server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # HTML entry point — never cache (references hashed JS/CSS filenames)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets (JS/CSS) — immutable long cache
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files — 24h cache for videos (was 1h - too short for B-roll)
    # Research: Extended cache reduces backend requests by 95%
    location ~* \.(mp4|mp3|webm|ogg|wav|m3u8|ts)$ {
        expires 24h;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges "bytes";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        etag on;

        # Proper MIME types for video formats
        types {
            video/mp4 mp4;
            video/webm webm;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # Images/fonts — long cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}

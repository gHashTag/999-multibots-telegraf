[build]
builder = "DOCKERFILE"
# dockerfilePath is deliberately NOT set here.
#
# Railway resolves the *path to this file* against the repo root (a
# railwayConfigFile of "render/railway.toml" failed with "service config at
# 'render/railway.toml' not found" despite the file existing at
# apps/vibee-editor/render/railway.toml), while the service-level
# dockerfilePath resolves against the Root Directory. Declaring the Dockerfile
# in both places invites the two conventions to disagree, so it lives only on
# the service: dockerfilePath = "render/Dockerfile", Root Directory =
# apps/vibee-editor.

[deploy]
# Served by render-server.ts itself (render-server.ts:1037).
healthcheckPath = "/health"
# Remotion downloads and warms Chrome on first boot; 300s is deliberate.
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
numReplicas = 1

[service]
name = "vibee-render"

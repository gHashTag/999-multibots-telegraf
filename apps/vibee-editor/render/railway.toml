[build]
builder = "DOCKERFILE"
# Relative to the service's Root Directory (apps/vibee-editor), which must be
# the parent of both render/ and packages/ — package.json depends on
# "@vibee/atoms": "file:../packages/vibee-atoms".
dockerfilePath = "render/Dockerfile"

[deploy]
# Served by render-server.ts itself (render-server.ts:1037).
healthcheckPath = "/health"
# Remotion downloads and warms Chrome on first boot; 300s is deliberate.
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
numReplicas = 1

[service]
name = "vibee-render"

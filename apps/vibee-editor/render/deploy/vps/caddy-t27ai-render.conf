# Caddy site block for the t27ai render. ADD it to /etc/caddy/Caddyfile as a
# new block; never edit another project's block. Run `caddy validate` before
# `systemctl reload caddy`. sslip.io resolves the name to the VPS address with
# no DNS record of ours, and Caddy gets the certificate by itself.
#
# Only /health and /api/* leave the host; the key-gated agent and mcp routes
# stay on loopback (the bot calls them locally).

t27ai-130-17-9-230.sslip.io {
	encode zstd gzip
	@render path /health /api/*
	handle @render {
		reverse_proxy 127.0.0.1:8090 {
			health_uri /health
			health_interval 30s
			health_timeout 10s
		}
	}
	handle {
		respond "not found" 404
	}
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options nosniff
	}
}

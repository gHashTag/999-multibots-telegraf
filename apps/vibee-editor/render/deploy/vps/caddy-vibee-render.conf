# Caddy site block for vibee-render on the T27OS VPS.
# Drop into /etc/caddy/Caddyfile (or an import dir) and set the DNS record
# for the name to the VPS IP. Caddy owns HTTPS automatically.
#
# The render serves its own /health (render-server.ts:1037); the mcp and
# api/agent routes are what the bot calls over X-Api-Key.

vibee-render.duckdns.org {
	encode zstd gzip
	reverse_proxy 127.0.0.1:8090 {
		health_uri /health
		health_interval 30s
		health_timeout 10s
		# First boot warms Chrome; give the same window Railway gives.
		fail_duration 300s
	}
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options nosniff
	}
	log {
		output file /var/log/caddy/vibee-render.access.log
	}
}

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Deploy when something the nginx image actually serves has changed.
#
# ── THIS FILE WAS INERT FROM 2026-09-09 TO 2026-09-18 ──────────────────────
#
# The service's "config as code" path was the bare string `railway.toml`.
# Railway resolves that from the REPO ROOT, not from the service's Root
# Directory -- so vibee-editor was reading `/railway.toml`, which belongs to
# the BOT. Proof, from the deployment record of the last green build
# (80ccc94b1): `"configFile": "/railway.toml"` with a manifest carrying
# `watchPatterns: ["src/**", ...]` and `healthcheckPath: "/health"`. Those are
# the bot's values; this file's were nowhere in it.
#
# The consequence was silent and total: the mini app was gated on `src/**`, a
# path it never touches. Every player-only merge answered "No changes to
# watched files" and was SKIPPED. #2525 -- which fixes the bot's start
# parameter so an onboarding link opens the right tab -- merged on 2026-09-17
# and never reached a single user; the live bundle still had zero occurrences
# of `tgWebAppStartParam`. The one player change that did ship (80ccc94b1) got
# through only because that deployment carried `ignoreWatchPatterns: true`.
#
# Fixed by setting the service's config path to the fully qualified
# `apps/vibee-editor/railway.toml`, which is the form vibee-render already
# used (`apps/vibee-editor/render/railway.toml`) and the reason IT was never
# affected. Nothing below changed; it simply started being read.
#
# ── WHAT THE PATTERNS MEAN ─────────────────────────────────────────────────
#
# These are the inputs the Dockerfile COPYs (packages/, player/, nginx/,
# entrypoint), so a change to any of them must rebuild, and nothing else
# should. Tests are never in the image, and a negation does NOT veto a
# deployment that also touches real sources -- the bot proved it by shipping
# 79b954bd5, a commit containing both `src/services/crmProactive.ts` and
# `src/__tests__/services/crmProactive.test.ts`.
#
# Patterns are given from the repo root (Railway resolves them there); the
# root-relative forms are kept as well in case the service evaluates against
# its Root Directory (apps/vibee-editor).
watchPatterns = [
  "apps/vibee-editor/player/**",
  "!apps/vibee-editor/player/**/*.test.ts",
  "!apps/vibee-editor/player/**/*.test.tsx",
  "apps/vibee-editor/packages/**",
  "apps/vibee-editor/nginx/**",
  "apps/vibee-editor/Dockerfile",
  "apps/vibee-editor/docker-entrypoint.sh",
  "apps/vibee-editor/railway.toml",
  "player/**",
  "!player/**/*.test.ts",
  "!player/**/*.test.tsx",
  "packages/**",
  "nginx/**",
  "Dockerfile",
  "docker-entrypoint.sh",
  "railway.toml",
]

[deploy]
# Served by nginx directly (see nginx/default.conf.template). NOT "/" — the SPA
# fallback returns 200 for every path, so "/" would pass even with an empty
# document root.
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ALWAYS"
numReplicas = 1

[service]
name = "vibee-editor"

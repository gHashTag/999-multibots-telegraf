name: Vibee
options:
  bundleIdPrefix: ai.t27
  deploymentTarget: { iOS: "17.0" }

# Схема ОБЩАЯ (shared), и это не косметика. Без файла в
# Vibee.xcodeproj/xcshareddata/xcschemes/ схема существует только как
# автосоздаваемая, и `gym`/`xcodebuild -scheme Vibee` на чистой машине
# падает с «scheme not found» — при том, что цель на месте и собирается.
# xcodegen пишет её сюда только при явном блоке schemes.
schemes:
  Vibee:
    build:
      targets:
        Vibee: all
        VibeeUITests: [test]
        VibeeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VibeeTests
        - VibeeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  # ЦЕЛЬ ДЛЯ UI-ТЕСТОВ. Заведена не ради обряда, а из-за конкретной боли.
  #
  # Проверка вкладки «ИИ» руками через координаты тапа не работает: масштаб
  # снимка симулятора 2,286, пересчёты мажут мимо строк, клавиатура
  # симулятора в русской раскладке превращает латиницу в кириллицу, а
  # pbcopy портит UTF-8. Час уходит на то, чтобы попасть по кнопке.
  #
  # XCUITest ищет элементы по опознавателям («ии.модель.glm-5.3»), а не по
  # пикселям, и печатает текст через API, минуя раскладку.
  # МОДУЛЬНАЯ ЦЕЛЬ — для чистой логики, которую UI-тест не достаёт.
  #
  # Её здесь не было, и это стоило реального дефекта: подбор оборванной
  # генерации искал задачу в окне «30 секунд НАЗАД», куда попадает предыдущая
  # генерация того же вида. Ни сборка, ни UI-тест этого не видят — окно
  # срабатывает только при двух запусках подряд. Нашлось перечитыванием кода
  # на следующий день, то есть случайно.
  VibeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VibeeTests
    dependencies:
      - target: Vibee
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vibee.app/Vibee"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Без этого сборка падает на подписи: «target does not have an
        # Info.plist file and one is not being generated automatically».
        # У UI-цели он уже есть, у модульной xcodegen его не заводит.
        GENERATE_INFOPLIST_FILE: YES

  VibeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VibeeUITests
    dependencies:
      - target: Vibee
    settings:
      base:
        TEST_TARGET_NAME: Vibee
        # Свой Info.plist цели тестов не нужен — пусть Xcode сгенерирует.
        GENERATE_INFOPLIST_FILE: YES
        # Та же ad-hoc подпись, что у приложения: без неё цель не ставится
        # на симулятор, а с чужими настройками — не совпадает с ним.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""

  Vibee:
    type: application
    platform: iOS
    sources:
      - Vibee
      # ИКОНКА ЛЕЖИТ РЯДОМ, НО В СБОРКУ НЕ ВХОДИТ. Строку ниже включает
      # тот, кто собирает для App Store, — и вот почему она не включена
      # по умолчанию.
      #
      # На этой машине Xcode 26.6 несёт SDK iOS 26.5 (23F81a), а из
      # симуляторных рантаймов установлен только 18.4 (22E238). При таком
      # разрыве `actool` отказывается собирать ЛЮБУЮ иконку приложения:
      #
      #   error: No simulator runtime version from ["22E238"] available
      #          to use with iphonesimulator SDK version 23F81a
      #
      # Проверено на двух разных исходных PNG и на двух раскладках
      # Contents.json (одноразмерной и полной устаревшей) — ошибка не в
      # картинке. Пустой набор иконок при тех же флагах собирается без
      # ошибки, то есть спотыкается именно отрисовка вариантов иконки.
      # Ни один флаг actool её не обходит: --target-device iphone,
      # --minimum-deployment-target 26.0, --standalone-icon-behavior none
      # дают тот же отказ.
      #
      # Включённая строка ломает не только архив, но и ежедневный
      # `./run.sh`: сборка под симулятор падает там же. Поэтому иконка
      # ждёт здесь, а не в сборке.
      #
      # ЧТО СДЕЛАТЬ, ЧТОБЫ ВКЛЮЧИТЬ (один раз, на машине выкладки):
      #   xcodebuild -downloadPlatform iOS     # рантайм под SDK 26.5
      # затем раскомментировать строку ниже. `fastlane preflight` проверит
      # и то и другое и не назовёт сборку готовой, пока иконки нет в
      # собранном .app.
      #
      # - AppIcon.xcassets
    info:
      path: Vibee/Info.plist
      properties:
        CFBundleDisplayName: Trinity S³AI
        UILaunchScreen: {}
        # ---------------------------------------------------------------
        # ATS ОСТАВЛЕН ПО УМОЛЧАНИЮ. Здесь стоял
        # `NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }` —
        # снятие защиты со ВСЕГО трафика ради ноля адресов, которым это
        # нужно.
        #
        # Проверено живьём, а не выведено из кода. Приложение ходит по
        # трём адресам: API (`API.swift:5`), хранилище роликов и картинок
        # `bucket-production-8259.up.railway.app` и `v3b.fal.media` —
        # последние два приходят В ОТВЕТЕ `/api/feed`, то есть их не видно
        # в исходниках и их легко проглядеть. Живой GET по ленте: 24
        # ссылки, http:// среди них НОЛЬ. Каждый из трёх хостов
        # договаривается на TLSv1.3 / TLS_AES_256_GCM_SHA384, а порог ATS
        # — TLS 1.2 с прямой секретностью. Ссылка на ролик отдаёт 200 без
        # перенаправления, то есть по дороге на http не сваливается.
        #
        # Почему не «пусть лежит, есть не просит»: произвольные загрузки
        # App Review требует ОБОСНОВАТЬ, а обосновать нечем — ни одного
        # адреса, ради которого исключение было бы заведено. И пока флаг
        # включён, случайно добавленный http-адрес молча заработает у
        # разработчика вместо того, чтобы сразу упасть.
        #
        # Если однажды понадобится http-хост — заводить NSExceptionDomains
        # на КОНКРЕТНЫЙ домен, а не возвращать эту строку.
        # ---------------------------------------------------------------
        # Версии НЕ числами, а ссылками на настройки сборки. Иначе номер
        # сборки живёт в отслеживаемом Info.plist: fastlane правит файл,
        # правка остаётся незакоммиченной, а следующий `xcodegen generate`
        # молча возвращает номер назад — и выкладка уходит со старым.
        # Ссылка на $(...) позволяет задать номер одной переменной сборки
        # в командной строке, не трогая ни одного файла в git.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Обязателен для App Store: ASC отклоняет загрузку без него даже
        # при наличии каталога иконок. Значение — имя набора в
        # Assets.xcassets, а не имя файла.
        CFBundleIconName: AppIcon
        # ---------------------------------------------------------------
        # ШРИФТ ВЕБА В БАНДЛЕ. Файлы лежат в Vibee/Fonts/ и попадают в
        # сборку как ресурсы (каталог Vibee целиком в `sources`), но одного
        # этого НЕ ХВАТАЕТ: без UIAppFonts система файл не регистрирует, и
        # `UIFont(name: "Outfit-Regular")` возвращает nil при .ttf, лежащем
        # внутри .app. Проверяется это в `Тема.Шрифт.подключён`, и при
        # промахе приложение молча набирается системным шрифтом.
        #
        # Имена БЕЗ папки: xcodegen кладёт ресурсы в корень бандла, а не
        # в подпапку Fonts/ — путь «Fonts/Outfit-Regular.ttf» система бы не
        # нашла. Сверено с содержимым собранного .app.
        UIAppFonts:
          - Outfit-Regular.ttf
          - Outfit-Medium.ttf
          - Outfit-SemiBold.ttf
          - Outfit-Bold.ttf
        # ---------------------------------------------------------------
        # ОПИСАНИЯ РАЗРЕШЕНИЙ. Намеренно закомментированы, а не удалены.
        #
        # Сегодня приложение НЕ обращается ни к камере, ни к микрофону, ни
        # к медиатеке: во всём Vibee/ нет ни AVCaptureDevice, ни
        # PhotosPicker/PHPhotoLibrary, ни AVAudioRecorder. Единственный
        # вызов из мира медиа — AVAudioSession.setCategory(.playback)
        # (FeedView.swift), а воспроизведение разрешений не требует.
        # Исходники для генерации приложение отправляет ССЫЛКАМИ, файлы с
        # устройства не читаются.
        #
        # Ключ разрешения в бандле, которым приложение не пользуется, — не
        # безобидная заготовка: App Review спрашивает, где именно оно
        # применяется, и не находит ответа. Поэтому текст лежит готовым
        # ЗДЕСЬ и раскомментируется в том же коммите, где появляется
        # пикер или запись, — не раньше.
        #
        # NSCameraUsageDescription: >-
        #   Съёмка кадра прямо в приложении, чтобы сразу отправить его в
        #   генерацию: липсинк накладывает речь на снятое лицо, перенос
        #   стиля перерисовывает снятый кадр. Снимок уходит на сервер
        #   генерации и нигде не публикуется, пока вы сами не поделитесь.
        # NSMicrophoneUsageDescription: >-
        #   Запись вашего голоса как исходника для липсинка: по этой
        #   дорожке на сервере двигаются губы аватара. Без записи
        #   останется только синтезированный голос из списка.
        # NSPhotoLibraryUsageDescription: >-
        #   Выбор уже снятого фото или ролика как исходника генерации,
        #   чтобы не переснимать. Читается ровно один файл — тот, что вы
        #   отметили в системном окне выбора.
        # NSPhotoLibraryAddUsageDescription: >-
        #   Сохранение готового ролика в медиатеку по кнопке «Сохранить».
        #   Приложение только добавляет новый файл и ничего не удаляет и
        #   не изменяет в существующих альбомах.
        # ---------------------------------------------------------------
        # ЭКСПОРТНОЕ СООТВЕТСТВИЕ.
        #
        # `false` НЕ означает «шифрования нет». Означает: всё шифрование,
        # которое есть, попадает под исключения Apple. Основание — не
        # догадка, а разбор всех вызовов криптографии в Vibee/*.swift:
        #
        #   • CryptoKit — не импортируется НИГДЕ;
        #   • CommonCrypto / CCCrypt / CC_SHA — нет;
        #   • SecKeyCreate*, SecKeyEncrypt, свои AES/RSA, самописные
        #     алгоритмы, обфускация полезной нагрузки — нет;
        #   • единственное обращение к Security.framework —
        #     `Identity.swift` (SecItemAdd / SecItemCopyMatching /
        #     SecItemDelete): это Keychain, то есть хранилище САМОЙ
        #     системы. Приложение не шифрует, а просит систему сохранить
        #     строку. Под исключение подпадает как «шифрование
        #     операционной системы Apple»;
        #   • наружу — только URLSession по HTTPS, три адреса, все на
        #     TLS 1.3 (см. блок про ATS выше). Стандартный TLS системы —
        #     тоже прямое исключение.
        #
        # Ни одного случая, который выводил бы приложение из-под
        # исключений, в коде нет — поэтому верное значение именно `false`,
        # а не `true`.
        #
        # ЧТО ЭТО МЕНЯЕТ: без ключа КАЖДАЯ сборка в TestFlight висит и
        # ждёт, пока человек руками ответит на вопрос об экспорте в App
        # Store Connect, и до ответа не уходит тестерам. С ключом уходит
        # сама.
        #
        # ГРАНИЦА ОТВЕТСТВЕННОСТИ: заявление делается не этой строкой, а
        # загрузкой сборки от имени владельца учётной записи. Фактическую
        # часть подтверждает разбор выше; подписывается под ней владелец.
        # Появится своя криптография — значение придётся пересматривать
        # В ТОМ ЖЕ коммите, что и её появление.
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.t27.vibee
      GENERATE_INFOPLIST_FILE: NO
      TARGETED_DEVICE_FAMILY: 1
      # Версия для людей и номер сборки для Apple — РАЗНЫЕ вещи. Первую
      # видно в TestFlight и в магазине, вторая обязана расти при каждой
      # загрузке, иначе ASC отвечает «build already exists».
      # Номер сборки перекрывается из командной строки:
      #   xcodebuild ... CURRENT_PROJECT_VERSION=<N>
      # именно так его подставляет fastlane, не трогая файлы.
      #
      # Обе строки обязаны быть ЗДЕСЬ, а не только в Info.plist. Без них
      # agvtool отвечает «There does not seem to be a CURRENT_PROJECT_VERSION
      # key set», и fastlane пишет номер прямо в ОТСЛЕЖИВАЕМЫЙ Info.plist —
      # каждый выпуск оставляет незакоммиченную правку. Хуже того: run.sh
      # зовёт `xcodegen generate` безусловно, а тот перегенерирует Info.plist
      # из этого файла и вернёт номер обратно в 1. Запуск run.sh между bump и
      # отправкой молча обнулял бы номер сборки.
      #
      # ЕДИНСТВЕННЫЙ экземпляр каждого ключа. Два параллельных PR внесли этот
      # блок дважды, и YAML не сказал ни слова: xcodegen отработал с кодом 0,
      # а побеждало ПОСЛЕДНЕЕ вхождение. Проверено — правка первого
      # MARKETING_VERSION на 2.0 не доезжала до сборки вовсе, там оставалось
      # 1.0. Ровно та потеря правки, против которой весь этот блок и написан.
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      # Явно, потому что теперь от него зависит загрузка: имя набора в
      # Vibee/Assets.xcassets. Значение по умолчанию совпадает, но
      # молчаливое совпадение здесь стоило бы отказа ASC.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Симулятор нужен явно. На этой машине стоит Xcode с SDK iOS 26.5, а
      # из рантаймов установлен только 18.4 — и без этой строки xcodebuild
      # предлагал ТОЛЬКО устройства, каждое с «iOS 26.5 is not installed».
      # То есть сборка была невозможна не из-за проекта, а из-за того, что
      # симуляторных назначений в списке не оказывалось вовсе.
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      # Автоподпись для устройства не нужна и мешает сборке под симулятор.
      # Подпись отключена ТОЛЬКО для симулятора.
      #
      # Безусловное NO чинило локальную сборку и молча ломало устройство:
      # приложение собиралось, но iPhone отвергал его с
      # ApplicationVerificationFailed — профиль не вшивался вовсе.
      # ПОДПИСЬ ДЛЯ СИМУЛЯТОРА НЕ ОТКЛЮЧЕНА, А САМОПОДПИСАНА.
      #
      # Здесь стояло CODE_SIGNING_ALLOWED=NO, и это тихо отнимало у сборки
      # ПРАВА: неподписанному приложению Keychain отвечает -34018
      # (errSecMissingEntitlement). Симптом был далеко от причины — вход по
      # коду проходил на сервере, код сгорал, токены не сохранялись, и
      # человек снова видел «нужен вход».
      #
      # Ad-hoc подпись («-») ничего не требует от разработчика: ни команды,
      # ни профиля, — и при этом вшивает entitlements. Замечание автора выше
      # остаётся в силе: безусловное значение ломало устройство, поэтому
      # ключи по-прежнему СИМУЛЯТОРНЫЕ, а устройство идёт своим путём.
      "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
      "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
      "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
      "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
      CODE_SIGN_ENTITLEMENTS: Vibee/Vibee.entitlements
      "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Vibee/Vibee-Simulator.entitlements
      # Команда ЗДЕСЬ, а не только в Xcode: `xcodegen generate` затирает всё,
      # что настроено мышью в Signing & Capabilities.
      DEVELOPMENT_TEAM: 5EM4M85VSQ
      CODE_SIGN_STYLE: Automatic

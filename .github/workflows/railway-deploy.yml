name: Deploy to Railway

# Auto-deploy disabled: Railway deploys this repo NATIVELY on push to main
# (verified — the bot service redeploys within seconds of a merge). This
# Actions-based path is redundant, depends on a RAILWAY_TOKEN secret that is not
# set (so it has never deployed successfully), and only added a red X to every
# main push while consuming Actions minutes. Kept as a manual-only fallback.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Railway
        uses: railwayapp/cli@v3
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          command: up --service 51666b9a-5337-47c9-a3e8-cbf292d2a47c --environment d54f1813-6221-4cc7-8e0a-ec0d330666a0

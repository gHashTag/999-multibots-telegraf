name: CI/CD Pipeline

on:
  push:
    branches: [ main, Jest-Test, cicd ]
  pull_request:
    branches: [ main, Jest-Test ]
  schedule:
    # Запускать ежедневно в 2:00 UTC для проверки зависимостей
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Manual and remote starts (the Queen scheduler on trios-agent-server
    # dispatches this workflow through the GitHub API).

# Минимальные права доступа
permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
  checks: write

jobs:
  # Быстрая проверка изменений
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      deps: ${{ steps.changes.outputs.deps }}
      docker: ${{ steps.changes.outputs.docker }}
      has_tests: ${{ steps.check_tests.outputs.has_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'src/**'
              - 'scripts/**'
              - '*.ts'
              - '*.js'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'bun.lockb'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'Makefile'

      - name: Check if tests exist
        id: check_tests
        run: |
          # Тесты лежат в src/__tests__, tests/ и src/inngest_app/test — искать
          # только корневой __tests__ значило «тестов нет» на каждом прогоне,
          # и job Tests молча пропускался.
          if [ "$(find . -path ./node_modules -prune -o \( -name '*.test.ts' -o -name '*.spec.ts' \) -print | head -1 | wc -l)" -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

  # Проверка безопасности и качества кода
  security-and-quality:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Security audit
        run: bun audit --audit-level=critical
        continue-on-error: true

      - name: Check for outdated dependencies
        run: bun outdated || true

      - name: ESLint
        run: bun run lint

      - name: Prettier check
        run: bunx prettier --check "src/**/*.ts"

      - name: TypeScript check
        run: bun run typecheck

      # Скрипты этих гейтов лежали в репозитории, но их не вызывал никто:
      # ни один шаг CI на них не ссылался. Гейт, который не запускается,
      # не отличим от отсутствующего.
      - name: Мёртвый домен в коде
        run: bun run check:dead-domain

      - name: Осиротевшие Inngest-события
        run: bun run check:events

      - name: Секреты в отслеживаемых файлах
        run: bun run security:scan

      - name: Check for circular dependencies
        run: bunx madge --circular src/
        continue-on-error: true

  # Основное тестирование с matrix (только если есть тесты)
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_tests == 'true' && (needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true')
    strategy:
      matrix:
        node-version: [18, 20, 21]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create test environment
        run: |
          touch .env.test
          echo "SUPABASE_URL=test_url" >> .env.test
          echo "SUPABASE_SERVICE_KEY=test_key" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      # Голый `bun test` подбирал ВСЕ *.test.ts, включая написанные под
      # vitest: 548 падений и код возврата 1 — шаг был красным сам по себе.
      # test:bun запускает только файлы, импортирующие 'bun:test'.
      - name: Run tests
        run: bun run test:bun
        env:
          NODE_ENV: test

      - name: Run Vitest tests (информативно)
        run: bun run test:vitest
        env:
          NODE_ENV: test
        continue-on-error: true

      # Настоящий гейт: падает только если тест, который ПРОХОДИЛ, перестал
      # проходить. Сравнивает множества с .test-baseline.txt, а не суммы.
      # У плеера своё окружение (jsdom) и свои зависимости: корневой
      # `bun install` их не ставит — workspaces в корне нет.
      - name: Установить зависимости плеера
        run: npm ci --prefix apps/vibee-editor/player

      - name: Тесты плеера (jsdom)
        run: bun run test:player

      - name: Типы плеера
        run: bun run check:player-types

      - name: Регрессии тестов
        if: matrix.node-version == '20'
        run: node scripts/test-gate.cjs
        env:
          NODE_ENV: test

      - name: Generate test coverage
        if: matrix.node-version == '20'
        run: bun test -- --coverage --coverageReporters=lcov
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Сборка проекта
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript
        run: bun run build

      - name: Build production
        run: bun run build:prod

      - name: Check build size
        run: |
          du -sh dist/
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/
          retention-days: 7

  # Проверка Docker контейнеров
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.src == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: multibots-telegraf:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Интеграционные тесты (только на main ветке и если есть тесты)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.has_tests == 'true' && (needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/

      - name: Run integration tests
        run: |
          # Добавить интеграционные тесты когда они появятся
          echo "Integration tests placeholder"
        env:
          NODE_ENV: test

  # Проверка зависимостей и лицензий
  dependency-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check licenses
        run: bunx license-checker --summary
        continue-on-error: true

      - name: Check bundle size
        run: |
          bunx bundlephobia-cli package.json || true

  # Финальная проверка перед мержем
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [security-and-quality, test, build, docker-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          # Проверяем обязательные джобы
          if [[ "${{ needs.security-and-quality.result }}" == "failure" || 
                "${{ needs.build.result }}" == "failure" || 
                "${{ needs.docker-check.result }}" == "failure" ]]; then
            echo "❌ Critical checks failed!"
            exit 1
          fi
          
          # Проверяем тесты только если они должны были запуститься
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Tests failed!"
            exit 1
          fi
          
          echo "✅ All checks passed!"

  # Уведомления о статусе
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [all-checks]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.all-checks.result }}" == "success" ]]; then
            echo "🎉 CI/CD pipeline completed successfully!"
          else
            echo "💥 CI/CD pipeline failed. Check the logs above."
          fi
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude-flow ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Запускать ежедневно в 2:00 UTC для проверки зависимостей
    - cron: '0 2 * * *'

# Минимальные права доступа
permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
  checks: write

jobs:
  # Быстрая проверка изменений
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      deps: ${{ steps.changes.outputs.deps }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'src/**'
              - 'scripts/**'
              - '*.ts'
              - '*.js'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'bun.lockb'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'Makefile'

  # Проверка безопасности и качества кода
  security-and-quality:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "src/**/*.ts"

      - name: TypeScript check
        run: npm run typecheck

      - name: Check for circular dependencies
        run: npx madge --circular src/
        continue-on-error: true

  # Основное тестирование с matrix
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
    strategy:
      matrix:
        node-version: [18, 20, 21]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          touch .env.test
          echo "SUPABASE_URL=test_url" >> .env.test
          echo "SUPABASE_SERVICE_KEY=test_key" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Run Jest tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Run Vitest tests
        run: npm run test:vitest
        env:
          NODE_ENV: test

      - name: Generate test coverage
        if: matrix.node-version == '20'
        run: npm test -- --coverage --coverageReporters=lcov
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Сборка проекта
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [changes, test, security-and-quality]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build production
        run: npm run build:prod

      - name: Check build size
        run: |
          du -sh dist/
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/
          retention-days: 7

  # Проверка Docker контейнеров
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.src == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: multibots-telegraf:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Интеграционные тесты (только на main ветке)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/

      - name: Run integration tests
        run: |
          # Добавить интеграционные тесты когда они появятся
          echo "Integration tests placeholder"
        env:
          NODE_ENV: test

  # Проверка зависимостей и лицензий
  dependency-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: npx license-checker --summary
        continue-on-error: true

      - name: Check bundle size
        run: |
          npx bundlephobia-cli package.json || true

  # Финальная проверка перед мержем
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [security-and-quality, test, build, docker-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.security-and-quality.result }}" == "failure" || 
                "${{ needs.test.result }}" == "failure" || 
                "${{ needs.build.result }}" == "failure" || 
                "${{ needs.docker-check.result }}" == "failure" ]]; then
            echo "❌ Some checks failed!"
            exit 1
          else
            echo "✅ All checks passed!"
          fi

  # Уведомления о статусе
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [all-checks]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.all-checks.result }}" == "success" ]]; then
            echo "🎉 CI/CD pipeline completed successfully!"
          else
            echo "💥 CI/CD pipeline failed. Check the logs above."
          fi
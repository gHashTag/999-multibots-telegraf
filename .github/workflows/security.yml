name: Security Checks

on:
  push:
    branches: [ main, Jest-Test, cicd ]
  pull_request:
    branches: [ main, Jest-Test ]
  schedule:
    # Запускать еженедельно по воскресеньям в 3:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Manual and remote starts (the Queen scheduler on trios-agent-server
    # dispatches this workflow through the GitHub API).

# Необходимые права для security проверок
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Проверка секретов и чувствительных данных
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for potential hardcoded credentials..."
          
          # Поиск потенциальных API ключей и токенов
          if grep -r -i -E "(api[_-]?key|secret[_-]?key|token|password|credential)" --include="*.ts" --include="*.js" --include="*.json" . | grep -v -E "(test|spec|example|placeholder|YOUR_|xxxx)" | grep -v node_modules; then
            echo "::warning::Potential hardcoded credentials found. Please review."
          fi
          
          # Поиск Telegram Bot токенов
          if grep -r -E "[0-9]{8,10}:[a-zA-Z0-9_-]{35}" --include="*.ts" --include="*.js" . | grep -v node_modules; then
            echo "::error::Telegram Bot Token pattern detected!"
            exit 1
          fi
          
          # Поиск OpenAI API ключей
          if grep -r -E "sk-[a-zA-Z0-9]{48}" --include="*.ts" --include="*.js" . | grep -v node_modules; then
            echo "::error::OpenAI API Key pattern detected!"
            exit 1
          fi

  # Анализ уязвимостей зависимостей
  dependency-security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Security audit (high and critical only)
        run: |
          bun audit --audit-level=high --production
          
      - name: Advanced security scan with bun audit
        run: |
          # Создаем детальный отчет
          bun audit --json > audit-report.json || true
          
          # Проверяем критические уязвимости
          CRITICAL=$(cat audit-report.json | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-report.json | jq -r '.metadata.vulnerabilities.high // 0')
          
          echo "Security scan results:"
          echo "- Critical vulnerabilities: $CRITICAL"
          echo "- High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found! Blocking deployment."
            bun audit --audit-level=critical
            exit 1
          elif [ "$HIGH" -gt 3 ]; then
            echo "::warning::Many high-severity vulnerabilities found ($HIGH). Consider updating dependencies."
          fi

      - name: Check for known malicious packages
        run: |
          # Проверяем известные проблемные пакеты
          MALICIOUS_PACKAGES="event-source-polyfill@0.0.9 ua-parser-js@0.7.29 rc@1.2.9"
          
          for package in $MALICIOUS_PACKAGES; do
            if bun pm ls $package 2>/dev/null; then
              echo "::error::Malicious package detected: $package"
              exit 1
            fi
          done

  # Static Application Security Testing (SAST)
  sast-analysis:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install security linters
        run: |
          bun add --dev eslint-plugin-security @typescript-eslint/eslint-plugin

      - name: Run security-focused ESLint rules
        run: |
          bunx eslint src/ --ext .ts \
            --rule 'security/detect-object-injection: error' \
            --rule 'security/detect-non-literal-require: error' \
            --rule 'security/detect-non-literal-fs-filename: error' \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-pseudoRandomBytes: error' \
            --rule 'security/detect-possible-timing-attacks: warn' \
            --rule 'no-eval: error' \
            --rule 'no-implied-eval: error' \
            --rule 'no-new-func: error' \
            --no-ignore
          
      - name: Check for dangerous patterns
        run: |
          echo "Scanning for dangerous code patterns..."
          
          # Проверка на использование eval, Function constructor
          if grep -r -E "(eval\s*\(|new\s+Function\s*\()" --include="*.ts" --include="*.js" src/; then
            echo "::error::Dangerous eval() or Function() constructor usage detected!"
            exit 1
          fi
          
          # Проверка на SQL инъекции
          if grep -r -E "SELECT.*\+|INSERT.*\+|UPDATE.*\+|DELETE.*\+" --include="*.ts" --include="*.js" src/; then
            echo "::warning::Potential SQL injection pattern detected. Use parameterized queries."
          fi
          
          # Проверка на небезопасные регулярные выражения
          if grep -r -E "RegExp\s*\(" --include="*.ts" --include="*.js" src/ | grep -E "\.\*\+|\+\.*\*"; then
            echo "::warning::Potential ReDoS (Regular Expression Denial of Service) vulnerability."
          fi

  # Проверка Docker образа (если есть)
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: multibots-telegraf:security-scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'multibots-telegraf:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Проверка конфигурации безопасности
  security-config:
    name: Security Configuration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment variable usage
        run: |
          echo "Checking environment variable security..."
          
          # Проверяем что секреты загружаются правильно
          if grep -r -E "process\.env\.[A-Z_]*TOKEN|process\.env\.[A-Z_]*KEY|process\.env\.[A-Z_]*SECRET" --include="*.ts" --include="*.js" src/; then
            echo "Environment variables found. Ensure they're validated."
          fi
          
          # Проверяем наличие .env в .gitignore
          if ! grep -q "\.env" .gitignore; then
            echo "::warning::.env files should be in .gitignore"
          fi

      - name: Check for secure HTTP headers
        run: |
          if [ -f "src/app.ts" ] || [ -f "src/server.ts" ]; then
            if ! grep -r -i "helmet\|x-frame-options\|x-content-type-options" src/; then
              echo "::warning::Consider adding security headers (helmet.js) to your Express app"
            fi
          fi

      - name: Validate TypeScript strict mode
        run: |
          if ! grep -q '"strict": true' tsconfig.json; then
            echo "::warning::Consider enabling TypeScript strict mode for better type safety"
          fi

  # Финальный отчет безопасности
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secrets-detection, dependency-security, sast-analysis, security-config]
    if: always()
    steps:
      - name: Security check summary
        run: |
          echo "## Security Scan Summary"
          
          if [[ "${{ needs.secrets-detection.result }}" == "success" && 
                "${{ needs.dependency-security.result }}" == "success" && 
                "${{ needs.sast-analysis.result }}" == "success" && 
                "${{ needs.security-config.result }}" == "success" ]]; then
            echo "✅ All security checks passed!"
          else
            echo "❌ Some security checks failed:"
            echo "- Secrets detection: ${{ needs.secrets-detection.result }}"
            echo "- Dependency security: ${{ needs.dependency-security.result }}"  
            echo "- Static analysis: ${{ needs.sast-analysis.result }}"
            echo "- Configuration check: ${{ needs.security-config.result }}"
            
            if [[ "${{ needs.secrets-detection.result }}" == "failure" || 
                  "${{ needs.dependency-security.result }}" == "failure" ]]; then
              echo "::error::Critical security issues found. Deployment blocked."
              exit 1
            fi
          fi
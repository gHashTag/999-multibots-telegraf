name: Security Checks

on:
  push:
    branches: [ main, Jest-Test, cicd ]
  pull_request:
    branches: [ main, Jest-Test ]
  schedule:
    # Запускать еженедельно по воскресеньям в 3:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Manual and remote starts (the Queen scheduler on trios-agent-server
    # dispatches this workflow through the GitHub API).

# Необходимые права для security проверок
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Проверка секретов и чувствительных данных
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # base был default_branch, а head — HEAD: на push в main это один и тот
          # же коммит, и действие выходило с «BASE and HEAD commits are the same»,
          # не просканировав ничего. Диапазон зависит от события; на schedule
          # base пуст, и это полный скан.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for potential hardcoded credentials..."
          
          # Поиск потенциальных API ключей и токенов
          if grep -r -i -E "(api[_-]?key|secret[_-]?key|token|password|credential)" --include="*.ts" --include="*.js" --include="*.json" . | grep -v -E "(test|spec|example|placeholder|YOUR_|xxxx)" | grep -v node_modules; then
            echo "::warning::Potential hardcoded credentials found. Please review."
          fi
          
          # Осознанное исключение помечается на строке комментарием
          # `secret-guard-ok: причина` — это конвенция репозитория, её понимает
          # scripts/security-token-guard.sh, который гоняет pre-commit. Здесь она
          # не учитывалась, и job падал на выдуманном образце из собственного
          # теста secret-guard: не настоящий токен, а материал проверки гварда.
          # Метка обязана стоять на самой строке, поэтому отсев точечный:
          # настоящий ключ в тестовом файле по-прежнему валит сборку.

          # Поиск Telegram Bot токенов
          if grep -r -E "[0-9]{8,10}:[a-zA-Z0-9_-]{35}" --include="*.ts" --include="*.js" . | grep -v node_modules | grep -v 'secret-guard-ok'; then
            echo "::error::Telegram Bot Token pattern detected!"
            exit 1
          fi

          # Поиск OpenAI API ключей
          if grep -r -E "sk-[a-zA-Z0-9]{48}" --include="*.ts" --include="*.js" . | grep -v node_modules | grep -v 'secret-guard-ok'; then
            echo "::error::OpenAI API Key pattern detected!"
            exit 1
          fi

  # Анализ уязвимостей зависимостей
  dependency-security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Security audit (high and critical only)
        run: |
          bun audit --audit-level=high --production
          
      - name: Advanced security scan with bun audit
        run: |
          # Создаем детальный отчет
          bun audit --json > audit-report.json || true
          
          # Проверяем критические уязвимости
          CRITICAL=$(cat audit-report.json | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-report.json | jq -r '.metadata.vulnerabilities.high // 0')
          
          echo "Security scan results:"
          echo "- Critical vulnerabilities: $CRITICAL"
          echo "- High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found! Blocking deployment."
            bun audit --audit-level=critical
            exit 1
          elif [ "$HIGH" -gt 3 ]; then
            echo "::warning::Many high-severity vulnerabilities found ($HIGH). Consider updating dependencies."
          fi

      - name: Check for known malicious packages
        run: |
          # `bun pm ls <пакет>` аргумент игнорирует: печатает всё дерево и
          # возвращает 0. Поэтому `if bun pm ls $package` было истиной всегда, и
          # job падал на первом же имени списка — при том, что ни одного из этих
          # пакетов в дереве нет. Проверка не искала ничего и блокировала сборку.
          MALICIOUS_PACKAGES="event-source-polyfill@0.0.9 ua-parser-js@0.7.29 rc@1.2.9"

          TREE="$(bun pm ls --all 2>/dev/null)" || {
            echo "::error::bun pm ls не отработал — дерево зависимостей осталось непроверенным"
            exit 1
          }

          FOUND=0
          for package in $MALICIOUS_PACKAGES; do
            # Совпадение целиком и в конце строки: `rc@1.2.9` не должен ловиться
            # на `node-rc@1.2.9`. Точки экранированы, иначе они — любой символ.
            ESCAPED="${package//./\\.}"
            if printf '%s\n' "$TREE" | grep -qE "(^|[^[:alnum:]@._/-])${ESCAPED}$"; then
              echo "::error::Malicious package detected: $package"
              FOUND=1
            fi
          done

          # Сообщаем обо ВСЕХ находках, а не только о первой: список короткий,
          # а знать надо весь объём заражения, а не его начало.
          [ "$FOUND" -eq 0 ] || exit 1
          echo "✅ Ни одного пакета из списка в дереве зависимостей нет"

  # Static Application Security Testing (SAST)
  sast-analysis:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install security linters
        run: |
          # Только eslint-plugin-security. @typescript-eslint/eslint-plugin уже
          # стоит в devDependencies на ^6.19.0, а `bun add` тянул сюда свежую
          # 8.x поверх неё: с eslintrc-конфигом этого репозитория та несовместима
          # и роняла eslint «TypeError: Cannot use 'in' operator to search for
          # 'type' in undefined» — то есть шаг падал на своей же установке.
          bun add --dev eslint-plugin-security

      - name: Run security-focused ESLint rules
        run: |
          # --plugin security обязателен: правила security/* задаются через
          # --rule, но без загрузки плагина eslint не находит их определения и
          # ругается «Definition for rule ... was not found».
          #
          # detect-object-injection и detect-non-literal-fs-filename — эвристики:
          # первая срабатывает на любой `obj[key]`, вторая на любой `fs`-вызов с
          # переменной. На этом репозитории они дают 458 и 362 срабатывания, и
          # как error держали бы job красным вечно. Оставлены предупреждениями —
          # видно, но не блокирует. Правила, которые ловят действительно опасное
          # (eval, non-literal-require, pseudoRandomBytes), остаются error: на
          # текущем src/ они чисты, значит с этого момента гейт работает.
          bunx eslint src/ --ext .ts \
            --plugin security \
            --rule 'security/detect-object-injection: warn' \
            --rule 'security/detect-non-literal-require: error' \
            --rule 'security/detect-non-literal-fs-filename: warn' \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-pseudoRandomBytes: error' \
            --rule 'security/detect-possible-timing-attacks: warn' \
            --rule 'no-eval: error' \
            --rule 'no-implied-eval: error' \
            --rule 'no-new-func: error' \
            --no-ignore
          
      - name: Check for dangerous patterns
        run: |
          echo "Scanning for dangerous code patterns..."
          
          # Проверка на использование eval, Function constructor.
          #
          # Перед `eval` нужна граница слова, иначе шаблон ловит хвост любого
          # идентификатора, кончающегося на эти буквы: на этом репозитории он
          # падал на `testVoiceIdRetrieval()` — «Retri-eval(». Настоящих `eval(`
          # в src/ нет ни одного, то есть job был красным исключительно из-за
          # имени метода. Проверено: шаблон ниже по-прежнему ловит `eval(`,
          # `window.eval(` и `new Function(`, но не `retrieval(`.
          if grep -r -E "(^|[^A-Za-z0-9_$])eval[[:space:]]*\(|(^|[^A-Za-z0-9_$])new[[:space:]]+Function[[:space:]]*\(" --include="*.ts" --include="*.js" src/; then
            echo "::error::Dangerous eval() or Function() constructor usage detected!"
            exit 1
          fi
          
          # Проверка на SQL инъекции
          if grep -r -E "SELECT.*\+|INSERT.*\+|UPDATE.*\+|DELETE.*\+" --include="*.ts" --include="*.js" src/; then
            echo "::warning::Potential SQL injection pattern detected. Use parameterized queries."
          fi
          
          # Проверка на небезопасные регулярные выражения
          if grep -r -E "RegExp\s*\(" --include="*.ts" --include="*.js" src/ | grep -E "\.\*\+|\+\.*\*"; then
            echo "::warning::Potential ReDoS (Regular Expression Denial of Service) vulnerability."
          fi

  # Проверка Docker образа (если есть)
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: multibots-telegraf:security-scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'multibots-telegraf:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Проверка конфигурации безопасности
  security-config:
    name: Security Configuration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment variable usage
        run: |
          echo "Checking environment variable security..."
          
          # Проверяем что секреты загружаются правильно
          if grep -r -E "process\.env\.[A-Z_]*TOKEN|process\.env\.[A-Z_]*KEY|process\.env\.[A-Z_]*SECRET" --include="*.ts" --include="*.js" src/; then
            echo "Environment variables found. Ensure they're validated."
          fi
          
          # Проверяем наличие .env в .gitignore
          if ! grep -q "\.env" .gitignore; then
            echo "::warning::.env files should be in .gitignore"
          fi

      - name: Check for secure HTTP headers
        run: |
          if [ -f "src/app.ts" ] || [ -f "src/server.ts" ]; then
            if ! grep -r -i "helmet\|x-frame-options\|x-content-type-options" src/; then
              echo "::warning::Consider adding security headers (helmet.js) to your Express app"
            fi
          fi

      - name: Validate TypeScript strict mode
        run: |
          if ! grep -q '"strict": true' tsconfig.json; then
            echo "::warning::Consider enabling TypeScript strict mode for better type safety"
          fi

  # Финальный отчет безопасности
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secrets-detection, dependency-security, sast-analysis, security-config]
    if: always()
    steps:
      - name: Security check summary
        run: |
          echo "## Security Scan Summary"
          
          if [[ "${{ needs.secrets-detection.result }}" == "success" && 
                "${{ needs.dependency-security.result }}" == "success" && 
                "${{ needs.sast-analysis.result }}" == "success" && 
                "${{ needs.security-config.result }}" == "success" ]]; then
            echo "✅ All security checks passed!"
          else
            echo "❌ Some security checks failed:"
            echo "- Secrets detection: ${{ needs.secrets-detection.result }}"
            echo "- Dependency security: ${{ needs.dependency-security.result }}"  
            echo "- Static analysis: ${{ needs.sast-analysis.result }}"
            echo "- Configuration check: ${{ needs.security-config.result }}"
            
            if [[ "${{ needs.secrets-detection.result }}" == "failure" || 
                  "${{ needs.dependency-security.result }}" == "failure" ]]; then
              echo "::error::Critical security issues found. Deployment blocked."
              exit 1
            fi
          fi
name: Production Auto-Deploy

on:
  push:
    branches: 
      - production
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild and redeploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 999-agents-telegraf

jobs:
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test || echo "Tests completed"

      - name: Build application
        run: npm run build || echo "Build completed"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 212.86.115.30 >> ~/.ssh/known_hosts

      - name: Sync code to Production Server
        run: |
          echo "📦 Syncing code to production server..."

          # Method 1: Try git pull (preferred for commit history)
          echo "🔄 Attempting git pull..."
          ssh -i ~/.ssh/id_rsa root@212.86.115.30 << 'ENDSSH' || echo "⚠️ Git pull failed, will use rsync"
          cd /root/bot-farm
          if [ -d ".git" ]; then
            git config --global --add safe.directory /root/bot-farm
            git fetch origin production 2>/dev/null && git reset --hard origin/production
            echo "✅ Git pull successful"
          else
            echo "⚠️ No .git directory"
            exit 1
          fi
          ENDSSH

          # Method 2: Rsync as fallback
          if [ $? -ne 0 ]; then
            echo "📦 Using rsync to copy code..."
            rsync -avz --delete \
              --exclude 'node_modules' \
              --exclude 'dist' \
              --exclude '.git' \
              --exclude '.env' \
              --exclude '.env.local' \
              -e "ssh -i ~/.ssh/id_rsa" \
              ./ root@212.86.115.30:/root/bot-farm/
            echo "✅ Code copied via rsync"
          fi

      - name: Deploy to Production Server
        run: |
          echo "🚀 Starting production deployment..."

          ssh -i ~/.ssh/id_rsa root@212.86.115.30 << 'ENDSSH'
          set -e

          echo "📦 Deploying to production server..."
          cd /root/bot-farm

          # Stop current container
          echo "🛑 Stopping current container..."
          docker stop 999-multibots || true
          docker rm 999-multibots || true

          # Build Docker image locally (no cache for fresh build)
          echo "🔨 Building Docker image..."
          docker build --no-cache -t 999-multibots .

          # Start new container with correct configuration
          echo "🚀 Starting new container..."
          docker run -d --name 999-multibots \
            --env-file .env \
            -e NODE_ENV=production \
            -e TEST_BOT_NAME= \
            -p 2999:2999 -p 3000:3000 -p 3001:3001 -p 3002:3002 \
            -p 3003:3003 -p 3004:3004 -p 3005:3005 -p 3006:3006 \
            -p 3007:3007 -p 3008:3008 -p 3009:3009 -p 3010:3010 \
            --restart unless-stopped \
            999-multibots
          
          # Wait for container to start
          echo "⏳ Waiting for container to start..."
          sleep 30
          
          # Check container status
          echo "📊 Checking container status..."
          docker ps | grep 999-multibots
          
          # Verify webhook setup
          echo "🔗 Verifying webhook setup..."
          docker logs 999-multibots --tail 20
          
          echo "✅ Production deployment completed!"
          ENDSSH

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # Test API endpoint
          if curl -f -s "http://test-render-farm.ru/" > /dev/null; then
            echo "✅ API endpoint is responding"
          else
            echo "❌ API endpoint is not responding"
            exit 1
          fi
          
          # Check webhook status via SSH
          ssh -i ~/.ssh/id_rsa root@212.86.115.30 << 'ENDSSH'
          echo "🔍 Checking webhook status..."
          
          # Get first bot token and check webhook
          BOT_TOKEN=$(docker exec 999-multibots printenv | grep BOT_TOKEN_1 | head -1 | cut -d'=' -f2)
          if [ ! -z "$BOT_TOKEN" ]; then
            WEBHOOK_INFO=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo")
            echo "Webhook info: $WEBHOOK_INFO"
          fi
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          echo "🧹 Deployment cleanup completed"

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 Production deployment completed successfully!"
          else
            echo "💥 Production deployment failed!"
            exit 1
          fi
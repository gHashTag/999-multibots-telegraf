name: Production Auto-Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild and redeploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

env:
  DEPLOY_PATH: /root/bot-farm
  CONTAINER_NAME: 999-multibots

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH key and handle any format issues
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add server to known hosts
          ssh-keyscan -H 212.86.115.30 >> ~/.ssh/known_hosts 2>/dev/null

          # Test SSH connection
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@212.86.115.30 'echo "✅ SSH connection successful"'

      - name: Sync Code to Server
        run: |
          echo "📦 Syncing code to production server..."

          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.*.local' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ root@212.86.115.30:${{ env.DEPLOY_PATH }}/

          echo "✅ Code synced successfully"

      - name: Deploy and Restart Container
        run: |
          echo "🚀 Starting production deployment..."

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@212.86.115.30 << 'ENDSSH'
          set -e

          cd ${{ env.DEPLOY_PATH }}

          echo "📊 Current deployment status:"
          docker ps | grep ${{ env.CONTAINER_NAME }} || echo "Container not running"

          # Stop and remove old container
          echo "🛑 Stopping old container..."
          docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

          # Build new Docker image with no cache
          echo "🔨 Building fresh Docker image..."
          docker build --no-cache -t ${{ env.CONTAINER_NAME }} .

          # Start new container with proper configuration
          echo "🚀 Starting new container..."
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -v ${{ env.DEPLOY_PATH }}/.env:/app/.env:ro \
            -e NODE_ENV=production \
            -p 3000:3000 \
            -p 2999:2999 -p 3001:3001 -p 3002:3002 -p 3003:3003 \
            -p 3004:3004 -p 3005:3005 -p 3006:3006 -p 3007:3007 \
            -p 3008:3008 -p 3009:3009 -p 3010:3010 \
            ${{ env.CONTAINER_NAME }}

          echo "✅ Container started successfully"
          ENDSSH

      - name: Wait for Service Startup
        run: |
          echo "⏳ Waiting for services to initialize..."
          sleep 15

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@212.86.115.30 << 'ENDSSH'
          set -e

          # Check container is running
          echo "📊 Container status:"
          if docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
            echo "✅ Container is running"
            docker ps | grep ${{ env.CONTAINER_NAME }}
          else
            echo "❌ Container is not running!"
            docker ps -a | grep ${{ env.CONTAINER_NAME }}
            echo "Container logs:"
            docker logs ${{ env.CONTAINER_NAME }} --tail 50
            exit 1
          fi

          # Check container logs for errors
          echo ""
          echo "📋 Recent container logs:"
          docker logs ${{ env.CONTAINER_NAME }} --tail 30

          # Check for critical errors in logs
          if docker logs ${{ env.CONTAINER_NAME }} 2>&1 | grep -i "error\|fatal\|exception" | grep -v "DeprecationWarning"; then
            echo "⚠️ Found potential errors in logs (review needed)"
          else
            echo "✅ No critical errors found in logs"
          fi
          ENDSSH

          # Test API endpoint
          echo ""
          echo "🌐 Testing API endpoint..."
          if curl -f -s -m 10 "http://212.86.115.30:3000/health" > /dev/null 2>&1 || \
             curl -f -s -m 10 "http://test-render-farm.ru/" > /dev/null 2>&1; then
            echo "✅ API endpoint is responding"
          else
            echo "⚠️ API endpoint check skipped or not responding (may be OK if webhooks are primary)"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "🧹 Cleanup completed"

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎉 DEPLOYMENT SUCCESSFUL!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📅 Time: $(date)"
            echo "🌐 Server: 212.86.115.30"
            echo "📦 Container: ${{ env.CONTAINER_NAME }}"
            echo "🔗 URL: http://test-render-farm.ru"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "💥 DEPLOYMENT FAILED!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Please check the logs above for details"
            exit 1
          fi

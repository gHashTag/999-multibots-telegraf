name: 🤖 Auto Merge Conflicts Resolver

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, cicd, develop]

jobs:
  auto-resolve-conflicts:
    name: 🔧 Auto Resolve Conflicts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: 📥 Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: 🔄 Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: 🔍 Check for conflicts
        id: conflicts
        run: |
          echo "Checking for conflicts with base branch..."
          BASE_BRANCH="${{ github.base_ref }}"
          echo "Base branch: $BASE_BRANCH"
          
          # Fetch latest changes
          git fetch origin $BASE_BRANCH:$BASE_BRANCH
          
          # Try merge to detect conflicts
          if git merge-tree $(git merge-base HEAD origin/$BASE_BRANCH) HEAD origin/$BASE_BRANCH | grep -q "^<<<<<"; then
            echo "conflicts_found=true" >> $GITHUB_OUTPUT
            echo "❌ Conflicts detected!"
            
            # Get conflicted files
            CONFLICTS=$(git merge-tree $(git merge-base HEAD origin/$BASE_BRANCH) HEAD origin/$BASE_BRANCH | grep -E "^@@|^<<<<<<<" | head -20)
            echo "conflicts_list<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "conflicts_found=false" >> $GITHUB_OUTPUT
            echo "✅ No conflicts found!"
          fi

      - name: 🤖 Auto-resolve textToVideoWizard conflicts
        if: steps.conflicts.outputs.conflicts_found == 'true'
        run: |
          echo "🔧 Attempting to auto-resolve textToVideoWizard conflicts..."
          
          # Start merge to create conflict state
          git merge origin/${{ github.base_ref }} || true
          
          # Check if textToVideoWizard has conflicts
          if git status --porcelain | grep -q "src/scenes/textToVideoWizard/index.ts"; then
            echo "🎬 textToVideoWizard conflict detected - applying resolution strategy..."
            
            # Use HEAD version (PR version) - since it's usually the fix
            git checkout --ours src/scenes/textToVideoWizard/index.ts
            git add src/scenes/textToVideoWizard/index.ts
            
            echo "✅ Resolved textToVideoWizard conflict using HEAD version"
          fi
          
          # Check for other common conflicts
          if git status --porcelain | grep -q "package"; then
            echo "📦 Package conflicts detected - using PR version..."
            git checkout --ours package*.json || true
            git add package*.json || true
          fi
          
          # Try to commit the resolution
          if git status --porcelain | grep -q "^M"; then
            git commit -m "🤖 auto-resolve: merge conflicts resolved automatically

Auto-resolved conflicts:
- textToVideoWizard: used HEAD version (PR changes)
- Package files: used HEAD version (PR changes)

Generated by GitHub Actions Auto-Conflict-Resolver
"
            echo "✅ Conflicts resolved and committed!"
            echo "resolved=true" >> $GITHUB_OUTPUT
          else
            git merge --abort || true
            echo "❌ Could not auto-resolve all conflicts"
            echo "resolved=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Push resolution
        if: steps.conflicts.outputs.conflicts_found == 'true' && steps.conflicts.outputs.resolved == 'true'
        run: |
          echo "🚀 Pushing auto-resolved conflicts..."
          git push origin ${{ github.head_ref }}

      - name: 💬 Comment on PR - Success
        if: steps.conflicts.outputs.conflicts_found == 'true' && steps.conflicts.outputs.resolved == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Конфликты автоматически разрешены!**
              
              ✅ Система автоматически разрешила конфликты merge в этом PR.
              
              **Применена стратегия разрешения:**
              - \`textToVideoWizard\`: использована версия из HEAD (ваши изменения)
              - \`package files\`: использована версия из HEAD (ваши изменения)
              
              **Результат:** PR готов к review и merge!
              
              *Автоматически сгенерировано GitHub Actions*`
            })

      - name: 💬 Comment on PR - Manual action needed
        if: steps.conflicts.outputs.conflicts_found == 'true' && steps.conflicts.outputs.resolved != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 **Требуется ручное разрешение конфликтов**
              
              ❌ Система не смогла автоматически разрешить все конфликты.
              
              **Обнаруженные конфликты:**
              \`\`\`
              ${{ steps.conflicts.outputs.conflicts_list }}
              \`\`\`
              
              **Действия:**
              1. Локально выполните \`git fetch\` и \`git merge origin/${{ github.base_ref }}\`
              2. Разрешите конфликты вручную
              3. Закоммитьте изменения: \`git commit -m "resolve: merge conflicts"\`
              4. Запушьте: \`git push\`
              
              *Автоматически сгенерировано GitHub Actions*`
            })

  # Дополнительная проверка статуса PR
  pr-status-check:
    name: ✅ PR Status Check  
    runs-on: ubuntu-latest
    needs: auto-resolve-conflicts
    if: always()
    
    steps:
      - name: 🎯 Final Status
        run: |
          echo "PR Status Check Complete"
          echo "Auto-resolve job status: ${{ needs.auto-resolve-conflicts.result }}"
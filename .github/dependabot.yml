version: 2
updates:
  # Обновления npm зависимостей
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "gHashTag"
    assignees:
      - "gHashTag"
    labels:
      - "dependencies"
      - "automated"
    # Группировка минорных и патч обновлений
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Отдельная группа для TypeScript и тестирования
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "jest"
          - "eslint*"
          - "prettier"
        dependency-type: "development"
      # Критичные обновления безопасности отдельно
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"

  # Обновления Docker базовых образов
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    commit-message:
      prefix: "docker"
    reviewers:
      - "gHashTag"
    labels:
      - "docker"
      - "infrastructure"

  # GitHub Actions обновления
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"  
      day: "wednesday"
    commit-message:
      prefix: "ci"
    reviewers:
      - "gHashTag"
    labels:
      - "github-actions"
      - "ci"
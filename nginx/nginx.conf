# NGINX Configuration for 999-multibots
# Production reverse proxy for three-head-dragon.shop

# HTTP Server (redirect to HTTPS)
server {
    listen 80;
    server_name three-head-dragon.shop;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name three-head-dragon.shop;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/three-head-dragon.shop.crt;
    ssl_certificate_key /etc/nginx/ssl/three-head-dragon.shop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Main API on port 3000
    location / {
        proxy_pass http://999-multibots:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bot webhooks (polling mode - no webhook paths)
    # Each bot runs independently in polling mode

    # API Endpoints
    location /api/ {
        proxy_pass http://999-multibots:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check
    location /health {
        proxy_pass http://999-multibots:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

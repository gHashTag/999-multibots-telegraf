# NGINX Configuration for 999-multibots
# Production reverse proxy for three-head-dragon.shop

# HTTP Server (redirect to HTTPS, except callback endpoint)
server {
    listen 80;
    server_name three-head-dragon.shop;

    # ✅ Allow callback endpoint on HTTP (for Railway render-server compatibility)
    location = /api/telegram/ai-reels-callback {
        # ⚠️ HTTP callback - Railway render-server doesn't follow redirects
        proxy_pass http://127.0.0.1:2999/api/telegram/ai-reels-callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # All other HTTP requests → redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name three-head-dragon.shop;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/three-head-dragon.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/three-head-dragon.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ✅ Callback endpoint on HTTPS (for other services)
    location = /api/telegram/ai-reels-callback {
        proxy_pass http://127.0.0.1:2999/api/telegram/ai-reels-callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # All other API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:2999/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main API on port 2999
    location / {
        proxy_pass http://127.0.0.1:2999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:2999/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ⛔️ ВНИМАНИЕ! DEV ОКРУЖЕНИЕ - ВЕТКА CICD ⛔️
# 
# ********************************************************
# *               DEV ENVIRONMENT CONFIG                 *
# *        Конфигурация для ветки CICD                  *
# *                                                       *
# * Сервер: 999-multibots-dev-u14194.vm.elestio.app    *
# * Ветка: cicd                                         *
# * Окружение: development                              *
# ********************************************************

services:
  app:
    container_name: 999-multibots-dev
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - '2999:2999'
      - '3000:3000'
      - '3001:3001'
      - '3002:3002'
      - '3003:3003'
      - '3004:3004'
      - '3005:3005'
      - '3006:3006'
      - '3007:3007'
      - '3008:3008'
      - '3009:3009'
      - '3010:3010'
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - BOT_TOKEN_1=${BOT_TOKEN_1_DEV}
      - BOT_TOKEN_2=${BOT_TOKEN_2_DEV}
      - BOT_TOKEN_3=${BOT_TOKEN_3_DEV}
      - BOT_TOKEN_4=${BOT_TOKEN_4_DEV}
      - BOT_TOKEN_5=${BOT_TOKEN_5_DEV}
      - BOT_TOKEN_6=${BOT_TOKEN_6_DEV}
      - BOT_TOKEN_7=${BOT_TOKEN_7_DEV}
      - BOT_TOKEN_8=${BOT_TOKEN_8_DEV}
      - BOT_TOKEN_9=${BOT_TOKEN_9_DEV}
      - BOT_TOKEN_10=${BOT_TOKEN_10_DEV}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY_DEV}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY_DEV}
      - INNGEST_URL=${INNGEST_URL_DEV}
      - INNGEST_BASE_URL=${INNGEST_BASE_URL_DEV}
      - SUPABASE_URL=${SUPABASE_URL_DEV}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY_DEV}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY_DEV}
      - ORIGIN=${ORIGIN_DEV}
      - ADMIN_IDS=${ADMIN_IDS}
      - SECRET_KEY=${SECRET_KEY_DEV}
      - LOG_FORMAT=${LOG_FORMAT}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - WEBHOOK_DOMAIN=https://999-multibots-dev-u14194.vm.elestio.app
      - DOCKER_ENVIRONMENT=true
      - DEBUG=true
      - TS_NODE_PROJECT=tsconfig.prod.json
      - SERVER_FILES_DIR=/etc/nginx/html/files/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/nginx:/etc/nginx
      - /etc/pki:/etc/pki
      - ./playbook.yml:/app/playbook.yml:ro
      - ./inventory-dev:/app/inventory:ro
      - ./roles:/app/roles:ro
      - files-volume-dev:/etc/nginx/html/files
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    networks:
      - app-network-dev
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: bot-proxy-dev
    ports:
      - '8443:443'
      - '8080:80'
    volumes:
      - ./nginx-config:/etc/nginx/conf.d:ro
      - /etc/pki/cert.crt:/etc/pki/cert.crt:ro
      - /etc/pki/key.pem:/etc/pki/key.pem:ro
      - files-volume-dev:/etc/nginx/html/files:ro
    depends_on:
      - app
    networks:
      - app-network-dev
    restart: unless-stopped

networks:
  app-network-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  nginx-config-volume-dev: 
  files-volume-dev:
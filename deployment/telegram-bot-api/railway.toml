# Our own Telegram Bot API server as a Railway service (README.md).
#
# Root directory of the service: deployment/telegram-bot-api. And the service's
# "Railway config file" must be set to /deployment/telegram-bot-api/railway.toml
# by hand (README step 1.3): Railway does not look for this file under the Root
# Directory, and without that setting everything below is silently ignored --
# every push to main would restart the server under every bot on it. No [service]
# section: it is not a config-as-code key, and deployment/remote-browser paid
# four failed deploys to learn that Railway rejects the whole file for it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Redeploy only when this directory changes. Every restart of this server is a
# few seconds in which every bot on it is unreachable; a push that touched
# only the bot must not cause one. Written from the repository root; README
# step 2 checks that a push touching only src/ leaves this service alone.
watchPatterns = ["deployment/telegram-bot-api/**"]

[deploy]
restartPolicyType = "ALWAYS"
# ONE replica, always. Two servers on one volume would both hold the same bot
# sessions, which is exactly the split this whole design exists to avoid.
numReplicas = 1

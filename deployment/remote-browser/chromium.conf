# One browser, two pilots.
#
# Derived from neko's own /etc/neko/supervisord/chromium.conf. Two changes,
# both load-bearing:
#
#   1. --bwsi is GONE. It means "browse without sign-in" (guest mode), where
#      the profile is thrown away. The whole product is persistent logins the
#      person creates themselves, so guest mode defeats it outright.
#
#   2. --remote-debugging-port=9222 is ADDED, so an agent can drive the very
#      browser the person is watching. Headful Chromium ignores
#      --remote-debugging-address and binds CDP to loopback only (measured
#      2026-09-20) -- which is exactly what we want. This port must never be
#      published out of the container: whoever reaches CDP reads every cookie
#      and acts as the person.
#
# --disable-file-system is kept for now. It blocks the page's file-system
# access; revisit when the agent needs uploads or downloads.
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
#
#   3. THE FLAGS LIVE IN A SCRIPT, not on this line. They were here, and a
#      shell was put in front of them to unlock the profile first; supervisord
#      split that line its own way and THE FLAGS NEVER REACHED CHROMIUM --
#      default profile, no debugging port, nothing on screen saying so. One
#      path, no arguments, nothing to mis-parse. See start-chromium.sh.
command=/usr/local/bin/start-chromium.sh
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

# Bridges Railway's TCP-proxy delivery port to neko's mux port.
#
# WHY: the ICE candidate carries neko's LISTEN port, and Railway's proxy
# remaps ports -- see start-webrtc-relay.sh for the whole story. On Railway
# the pod is configured with NEKO_WEBRTC_TCPMUX=<the proxy's public port>
# and WEBRTC_RELAY_LISTEN_PORT=<the port the proxy delivers to>; the script
# compares the two and relays only when they differ, so this same conf is
# safe on a laptop, where both numbers are equal and it sleeps.
#
# pf=ip6,ipv6only=0 for the same reason as cdp-bridge.conf: bind both
# families on the one port so the platform's network kind does not matter.
[program:webrtc-relay]
command=/usr/local/bin/start-webrtc-relay.sh
autorestart=true
priority=850
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/webrtc-relay.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

# The per-client browser pod as a Railway service.
#
# Railway is this project's hosting and it runs containers happily. What it
# has no API for is starting a machine per visit and stopping it after, so
# here a pod is a service somebody provisioned once and the broker hands that
# one out (`fixed` driver, src/browser/pod-driver.ts). The cost of that is
# written there: one browser, not one per client.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# neko answers on 8080; there is no /health, and the root is the viewer.
restartPolicyType = "ALWAYS"
numReplicas = 1

# NO [service] SECTION. It is not a Railway config-as-code key, and it cost
# every deploy of this pod: Railway rejected the whole file before building,
# instantly and with no log -- "scheduling build on Metal builder", then
# "Deploy failed", four times over two days. Found by bisection on
# 2026-09-21: the bare upstream image built, our full Dockerfile with ONLY
# [build] built, and this file with [service] did not. The service name is
# chosen on the command line (`railway up --service browser-pod`), not here.

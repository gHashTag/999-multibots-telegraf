# Forwards CDP from Chromium's loopback to the container's own interface.
#
# Measured 2026-09-20: headful Chromium ignores --remote-debugging-address,
# so 9222 is reachable only from inside the container. The broker runs in a
# different container and needs it; this is the whole reason this file exists.
#
# `reuseaddr` so a restart does not wait out TIME_WAIT, `fork` so more than
# one CDP connection works at once.
[program:cdp-bridge]
# DUAL STACK. Railway's private network between services has been IPv6, and
# socat's TCP-LISTEN binds IPv4 alone by default: the broker would resolve
# browser-pod.railway.internal to an IPv6 address and find nothing listening.
# pf=ip6 with ipv6only=0 takes both families on the one port, so this works
# on a private network of either kind and on a laptop.
command=/usr/bin/socat TCP-LISTEN:9223,pf=ip6,ipv6only=0,fork,reuseaddr TCP:127.0.0.1:9222
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/cdp-bridge.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
